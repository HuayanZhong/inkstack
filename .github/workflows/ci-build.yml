name: CI build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_UI: 'false'
  # shell 的构建期校验需要该变量；CI 不依赖本地 .env 文件。
  NEXT_PUBLIC_CANVAS_MF_ENTRY: 'http://localhost:4002/mf-manifest.json'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # hygiene 自己会构建 packages，再跑 knip 与 publint；Turbo 缓存会复用上面的产物。
      - name: Hygiene
        run: pnpm hygiene
