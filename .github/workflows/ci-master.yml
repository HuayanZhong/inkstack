name: CI master

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一轮。
concurrency:
  group: ci-master-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    uses: ./.github/workflows/ci-static.yml

  test:
    uses: ./.github/workflows/ci-test.yml

  build:
    uses: ./.github/workflows/ci-build.yml
