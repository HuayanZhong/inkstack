version: 2

# 依赖巡检：每天 04:00 Asia/Shanghai。cooldown 只作用于版本更新，
# 安全更新不受影响；数值与 pnpm 12 的默认 release age 对齐。
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: cron
      cronjob: '0 4 * * *'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies
    groups:
      toolchain:
        patterns:
          - oxlint
          - oxlint-tsgolint
          - '@fission-ai/openspec'
        update-types:
          - minor
          - patch
      test-stack:
        patterns:
          - vitest
          - vite
          - '@vitest/coverage-v8'
        update-types:
          - minor
          - patch
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
    ignore:
      # TS 7 移除了 Next 16 类型检查依赖的 typescript/lib/typescript.js。
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @types/node 主版本跟随运行时 Node，不单独跨大版本。
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: cron
      cronjob: '0 4 * * *'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
