# 项目中的所有包
packages:
  - 'apps/*'
  - 'packages/*'

catalogs:
  # 精确 pin：影响构建或类型，升级时只改这里。
  toolchain:
    '@fission-ai/openspec': 1.14.3
    oxfmt: 0.73.0
    oxlint: 1.88.0
    oxlint-tsgolint: 7.0.2004
    typescript: 6.0.3
  # 开发工具与类型包，允许 minor/patch 浮动。
  dev:
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    '@nestjs/cli': ^12.0.8
    '@nestjs/schematics': ^12.0.7
    '@rspack/cli': ^2.2.9
    '@rspack/core': ^2.2.9
    '@rspack/dev-server': ^2.2.1
    '@rspack/plugin-react-refresh': ^2.0.2
    '@types/node': ^26.6.5
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    dotenv-cli: ^11.0.0
    eslint-plugin-turbo: ^2.11.9
    husky: ^9.1.7
    knip: ^6.41.0
    lint-staged: ^17.6.0
    postcss: ^8.5.30
    postcss-loader: ^8.2.1
    publint: ^0.3.25
    react-refresh: ^0.19.0
    turbo: ^2.11.9
    yaml: ^2.9.1
  # 运行时库：Next / tldraw / Nest / AI SDK 等；首个依赖进入时创建。
  runtime:
    '@module-federation/enhanced': ^2.9.2
    '@nestjs/common': ^12.1.3
    '@nestjs/core': ^12.1.3
    '@nestjs/platform-express': ^12.1.3
    next: ^16.4.2
    react: ^19.3.0
    react-dom: ^19.3.0
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2
    tldraw: ^5.5.2
    zod: ^4.6.7

# oxlint 提供 ESLint v9 兼容的插件运行时；eslint-plugin-turbo 只在类型层引用 eslint。
peerDependencyRules:
  ignoreMissing:
    - eslint

# 依赖含 install / postinstall 脚本时（如 esbuild、sharp），
# 运行 `pnpm approve-builds`，pnpm 11+ 会把包名写入这里。
# allowBuilds:
#   esbuild: true
