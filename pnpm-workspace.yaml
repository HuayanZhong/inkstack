# 项目中的所有包
packages:
  - 'apps/*'
  - 'packages/*'

# peer 只用于类型层时不要自动安装；缺失 peer 由 peerDependencyRules 明确处理。
autoInstallPeers: false

catalogs:
  # 精确 pin：影响构建或类型，升级时只改这里。
  toolchain:
    '@fission-ai/openspec': 1.15.0
    oxfmt: 0.74.0
    oxlint: 1.89.0
    oxlint-tsgolint: 7.0.2005
    typescript: 6.0.3
  # 开发工具与类型包，允许 minor/patch 浮动。
  dev:
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    '@nestjs/cli': ^12.0.10
    '@nestjs/schematics': ^12.0.10
    '@nestjs/testing': ^12.2.0
    '@rspack/cli': ^2.2.9
    '@rspack/core': ^2.2.9
    '@rspack/dev-server': ^2.2.1
    '@rspack/plugin-react-refresh': ^2.0.2
    '@tailwindcss/postcss': ^4.3.3
    '@testing-library/dom': ^10.4.2
    '@testing-library/jest-dom': ^7.0.1
    '@testing-library/react': ^16.3.3
    '@types/node': ^26.6.5
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@types/supertest': ^7.2.1
    '@vitest/coverage-v8': ^5.0.5
    cross-env: ^10.1.0
    dotenv-cli: ^11.0.0
    eslint-plugin-turbo: ^2.11.10
    husky: ^9.1.7
    jsdom: ^30.1.3
    knip: ^6.43.0
    lint-staged: ^17.6.0
    postcss: ^8.5.31
    postcss-loader: ^8.2.1
    publint: ^0.3.25
    react-refresh: ^0.19.0
    shadcn: ^4.22.1
    socket.io-client: ^4.8.4
    supertest: ^7.3.1
    tailwindcss: ^4.3.3
    turbo: ^2.11.10
    tw-animate-css: ^1.4.0
    vite: ^8.3.5
    vitest: ^5.0.5
    yaml: ^2.9.1
  # 运行时库：Next / tldraw / Nest / AI SDK 等；首个依赖进入时创建。
  runtime:
    '@base-ui/react': ^1.9.0
    '@module-federation/enhanced': ^2.9.2
    '@nestjs/common': ^12.2.0
    '@nestjs/core': ^12.2.0
    '@nestjs/platform-express': ^12.2.0
    '@nestjs/platform-socket.io': ^12.2.0
    '@nestjs/websockets': ^12.2.0
    class-variance-authority: ^0.7.1
    cn: ^0.5.0
    eventsource-parser: ^4.1.2
    ky: ^2.2.0
    lucide-react: ^1.61.0
    next: ^16.4.3
    next-themes: ^0.4.6
    react: ^19.3.0
    react-dom: ^19.3.0
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2
    tldraw: ^5.5.4
    zod: ^4.6.7

# oxlint 提供 ESLint v9 兼容的插件运行时；eslint-plugin-turbo 只在类型层引用 eslint。
peerDependencyRules:
  ignoreMissing:
    - eslint

# 依赖含 install / postinstall 脚本时（如 esbuild、sharp），
# 运行 `pnpm approve-builds`，pnpm 11+ 会把包名写入这里。
# allowBuilds:
#   esbuild: true
